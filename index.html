<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>乐高像素画转换器</title>
  <style>
    :root {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color-scheme: light;
    }
    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    .panel, .canvas-panel {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      padding: 16px;
    }
    .panel h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    .control {
      margin-bottom: 14px;
    }
    .control label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .control input[type="range"] {
      width: 100%;
    }
    .muted {
      color: #6b7280;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    button, input[type="file"]::file-selector-button {
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .secondary {
      background: #374151;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #e5e7eb;
      display: block;
    }
    .stats {
      margin-top: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h1>🧱 乐高像素画转换器</h1>
      <div class="control">
        <label for="upload">上传图片</label>
        <input id="upload" type="file" accept="image/*" />
      </div>
      <div class="control">
        <label for="gridSize">颗粒大小（越小越精细）: <span id="gridValue">18</span> px</label>
        <input id="gridSize" type="range" min="8" max="40" value="18" />
      </div>
      <div class="control">
        <label for="colorLevels">颜色数量（模拟乐高色板）: <span id="colorValue">24</span></label>
        <input id="colorLevels" type="range" min="6" max="48" value="24" />
        <p class="muted">颜色越少，拼搭感越明显。</p>
      </div>
      <div class="btns">
        <button id="render" disabled>生成乐高像素画</button>
        <button id="download" class="secondary" disabled>下载 PNG</button>
      </div>
      <div class="stats" id="stats">请先上传图片。</div>
    </section>

    <section class="canvas-panel">
      <canvas id="canvas" width="900" height="600"></canvas>
    </section>
  </div>

  <script>
    const uploadInput = document.getElementById('upload');
    const gridSizeInput = document.getElementById('gridSize');
    const colorLevelsInput = document.getElementById('colorLevels');
    const gridValue = document.getElementById('gridValue');
    const colorValue = document.getElementById('colorValue');
    const renderBtn = document.getElementById('render');
    const downloadBtn = document.getElementById('download');
    const stats = document.getElementById('stats');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const image = new Image();
    let hasImage = false;

    function quantize(v, levels) {
      if (levels <= 1) return 0;
      const step = 255 / (levels - 1);
      return Math.round(v / step) * step;
    }

    function drawLegoDot(x, y, size, rgb) {
      const [r, g, b] = rgb;
      const fill = `rgb(${r}, ${g}, ${b})`;
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, size, size);

      const cx = x + size / 2;
      const cy = y + size / 2;
      const radius = size * 0.28;

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,0.20)`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx - radius * 0.28, cy - radius * 0.28, radius * 0.45, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,0.35)`;
      ctx.fill();

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
    }

    function updateLabels() {
      gridValue.textContent = gridSizeInput.value;
      colorValue.textContent = colorLevelsInput.value;
    }

    function render() {
      if (!hasImage) return;

      const blockSize = Number(gridSizeInput.value);
      const levelCount = Number(colorLevelsInput.value);

      const maxCanvasW = 900;
      const maxCanvasH = 700;
      const ratio = Math.min(maxCanvasW / image.width, maxCanvasH / image.height, 1);
      const targetW = Math.max(blockSize, Math.floor(image.width * ratio));
      const targetH = Math.max(blockSize, Math.floor(image.height * ratio));

      canvas.width = targetW;
      canvas.height = targetH;

      const temp = document.createElement('canvas');
      temp.width = targetW;
      temp.height = targetH;
      const tctx = temp.getContext('2d');
      tctx.drawImage(image, 0, 0, targetW, targetH);

      const imgData = tctx.getImageData(0, 0, targetW, targetH).data;

      ctx.clearRect(0, 0, targetW, targetH);

      let studsX = 0;
      let studsY = 0;

      for (let y = 0; y < targetH; y += blockSize) {
        studsY++;
        let xCounted = 0;
        for (let x = 0; x < targetW; x += blockSize) {
          xCounted++;
          const sampleX = Math.min(targetW - 1, x + Math.floor(blockSize / 2));
          const sampleY = Math.min(targetH - 1, y + Math.floor(blockSize / 2));
          const idx = (sampleY * targetW + sampleX) * 4;

          const r = quantize(imgData[idx], levelCount);
          const g = quantize(imgData[idx + 1], levelCount);
          const b = quantize(imgData[idx + 2], levelCount);

          drawLegoDot(x, y, blockSize, [r, g, b]);
        }
        studsX = Math.max(studsX, xCounted);
      }

      const total = studsX * studsY;
      stats.innerHTML = `✅ 生成完成<br>尺寸：${targetW} × ${targetH}px<br>颗粒网格：${studsX} × ${studsY}<br>预计颗粒总数：${total}`;
      downloadBtn.disabled = false;
    }

    uploadInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        image.onload = () => {
          hasImage = true;
          renderBtn.disabled = false;
          render();
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    [gridSizeInput, colorLevelsInput].forEach((input) => {
      input.addEventListener('input', () => {
        updateLabels();
        if (hasImage) render();
      });
    });

    renderBtn.addEventListener('click', render);

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'lego-pixel-art.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    updateLabels();
    ctx.fillStyle = '#9ca3af';
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('上传图片后在这里预览', canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
